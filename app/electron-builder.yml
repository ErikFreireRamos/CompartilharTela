appId: br.compartilhadordetela.app
productName: CompartilhadorDeTela
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  # livekit-server.exe (servidor de mídia) e audio-capture.exe (áudio por app)
  - from: resources/bin
    to: bin
    filter:
      - '*.exe'
win:
  target: nsis
nsis:
  oneClick: false
  # instalação para todos os usuários: precisa de admin para criar as regras de firewall
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: CompartilhadorDeTela-Setup-${version}.${ext}
