[workspace]
resolver = "2"
members = [
    "crates/ct-core",
    "crates/ct-media",
    "crates/ct-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.22"
directories = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
iroh = "1.5"
jpeg-encoder = "0.7"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

ct-core = { path = "crates/ct-core" }
ct-media = { path = "crates/ct-media" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
